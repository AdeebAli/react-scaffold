# Security headers. nginx drops server-level add_header directives in any
# location that sets its own, so include this file in every block that uses
# add_header (see default.conf).

# connect-src must list the API origin (VITE_APP_API_URL, baked in at build
# time). Update it when the API origin changes.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://jsonplaceholder.typicode.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
