server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite fingerprints files in /assets, so they can be cached forever.
    location ^~ /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The SPA shell must be revalidated so new deploys are picked up.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Missing files with an extension are real 404s.
    location ~ \.[a-zA-Z0-9]+$ {
        try_files $uri =404;
    }

    # Everything else is a client-side route: serve the SPA shell.
    location / {
        try_files $uri /index.html;
    }
}
